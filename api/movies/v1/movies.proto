syntax = "proto3";
package movies.v1;
option go_package = "go_hw/api/movies/v1;moviesv1";

service MovieService {
  rpc LoadMovies(LoadMoviesRequest) returns (LoadMoviesResponse);
  rpc GetLastMovie(GetLastMovieRequest) returns (Movie);
}
message Movie {
  int64 id = 1;
  string title = 2;
  int32 year = 3;
  string director = 4;
}
message LoadMoviesRequest { int64 from = 1; int64 to = 2; }
message MovieError { int64 id = 1; string code = 2; string message = 3; }
message LoadMoviesResponse {
  repeated Movie movies = 1;
  repeated MovieError errors = 2;
}
message GetLastMovieRequest {}
